# Keep the dependencies current without turning it into a job.
#
# npm: weekly, minor and patch grouped into one pull request so a week of
# updates arrives as one reviewable diff. Major versions are deliberately left
# out of the group — those are decisions, not maintenance, and they deserve
# their own pull request with the migration notes read first.
#
# GitHub Actions: monthly. Actions are pinned to majors by design (see
# scripts/lint-workflows.mjs); a bump means reading the action's release notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - desktop
    commit-message:
      prefix: 'deps(desktop)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'deps(ci)'
