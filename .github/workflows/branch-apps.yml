name: Build the apps from this branch

# Temporary: the session's integration token can dispatch workflows but this
# repository refuses it, so a push asks for the same run the Actions UI's
# "Run workflow" button makes — the real Apps pipeline, not a copy of it.
# Removed from the branch as soon as the artifacts exist.

on:
  push:
    branches: ['arena/01a0ff13-planner']

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Apps to build this branch, pointed at the deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run apps.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f api_origin=https://matin-habit-tracker.vercel.app
          sleep 15
          gh run list --repo "$GITHUB_REPOSITORY" --workflow=apps.yml --limit 3
