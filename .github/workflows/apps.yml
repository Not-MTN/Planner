name: Apps

# Builds the things people install: the Windows/macOS/Linux installers, the
# Android APK + Play bundle, and an unsigned iOS archive. Manual runs keep the
# outputs as build artifacts; stable version tags attach them and a
# checksummed update manifest (including the APK signer identity) to the release.
#
# Manual Android builds may use the debug key for testing. Public version tags
# require the permanent sideload keystore and a pinned certificate fingerprint;
# the Apple build stays unsigned until a maintainer adds signing certificates.
#
# The API address is baked in at build time. Set the optional inputs (or the
# PLANNER_APP_URL / PLANNER_API_ORIGIN repository variables) once, and every
# future build of every app is already pointed at your deployment.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Load this deployment in the shells (blank = bundled, offline build)'
        required: false
        type: string
      api_origin:
        description: 'API origin for the bundled builds, e.g. https://planner.example.com'
        required: false
        type: string
      link_origin:
        description: 'Domain whose links open the app (blank = the app/API address above)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  APP_URL: ${{ inputs.app_url || vars.PLANNER_APP_URL || '' }}
  # The deployment the apps talk to. Override per run (the `api_origin` input),
  # for every run (the PLANNER_API_ORIGIN repository variable), or by editing
  # this line. Leave it empty to build apps that are local-only.
  API_ORIGIN: ${{ inputs.api_origin || vars.PLANNER_API_ORIGIN || 'https://matin-habit-tracker.vercel.app' }}
  # A version tag (`v1.2.0`) names the build; a manual run has no tag and
  # falls back to the defaults in app/build.gradle and desktop/package.json.
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # Play requires versionCode to increase with every upload. The run number
  # always increases, so a tag build is uploadable as-is.
  VERSION_CODE: ${{ github.run_number }}

jobs:
  # Runs where the network is: this is the only place a build can ask the
  # deployment whether it accepts the packaged apps, so it is the one place a
  # misconfigured server is caught before an app that cannot sign in is built.
  preflight:
    name: The apps could sign in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the deployment the apps will talk to
        if: ${{ env.API_ORIGIN != '' }}
        run: |
          code=0
          node scripts/check-deployment.mjs "$API_ORIGIN" || code=$?
          case "$code" in
            0)
              exit 0
              ;;
            2)
              # A wrong address, an outage, a network problem: says nothing
              # either way, so it must not fail somebody's build.
              echo "::warning title=Could not check the deployment::${API_ORIGIN} could not be reached, so it was not verified. The app builds, but sign-in is unproven."
              exit 0
              ;;
            3)
              echo "::error title=API_ORIGIN is not a URL::Set it to a bare origin such as https://your-app.example.com, without a path."
              exit 1
              ;;
          esac
          {
            echo "## ✗ The apps this build makes could not sign in"
            echo ""
            echo "\`${API_ORIGIN}\` answers, but it refuses the origins the apps run from."
            echo "Every account, sync and AI request would come back 403, and the app can"
            echo "only show that as \"offline\"."
            echo ""
            echo "Set this in the deployment's environment variables and redeploy:"
            echo ""
            echo '```'
            echo "PLANNER_APP_ORIGINS=https://localhost,capacitor://localhost,app://planner"
            echo '```'
            echo ""
            echo "Then run this workflow again. docs/APPS.md §2 explains what it does."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=The apps could not sign in::${API_ORIGIN} refuses the packaged apps' origins. Set PLANNER_APP_ORIGINS on the deployment (see the run summary) and run this again."
          exit 1
        env:
          API_ORIGIN: ${{ env.API_ORIGIN }}

  release-contract:
    name: Verify public release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Branch/manual artifacts may use the debug key for testing. A public tag
    # must have the permanent sideload signing key and its pinned fingerprint.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      PLANNER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      PLANNER_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag, permanent app IDs, and signing configuration
        run: node scripts/validate-release-contract.mjs

  desktop:
    name: Desktop installers (${{ matrix.target }})
    needs: [preflight, release-contract]
    runs-on: ${{ matrix.os }}
    # `compression: maximum` (desktop/electron-builder.yml) is what keeps the
    # installers small, and it costs real minutes on the Windows and Linux
    # runners, which build one artefact per architecture. Leave headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install desktop dependencies
        run: npm ci --prefix desktop --ignore-scripts
        # `--ignore-scripts` skips Electron's own binary download, which the
        # packaging step below needs, so fetch it explicitly.
      - name: Fetch Electron
        run: node desktop/node_modules/electron/install.js
      - name: Build installers
        # bash on every runner on purpose: Windows defaults to pwsh, and this
        # needs the same shell semantics as the other two.
        shell: bash
        run: |
          set -o pipefail
          if npm run desktop:dist -- --${{ matrix.target }} 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            exit 0
          fi
          # The job log sits behind signed blob storage, so put the part that
          # matters where it can be read without opening the run in a browser.
          bash "$GITHUB_WORKSPACE/scripts/ci-annotate.sh" "$RUNNER_TEMP/build.log" \
            "electron-builder failed (${{ matrix.target }})"
          exit 1
        env:
          PLANNER_APP_URL: ${{ env.APP_URL }}
          PLANNER_API_ORIGIN: ${{ env.API_ORIGIN }}
          PLANNER_VERSION_NAME: ${{ env.VERSION_NAME }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: planner-desktop-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK and Play bundle
    needs: [preflight, release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secrets cannot be read inside an `if:` directly; carrying them in the
    # job environment is the supported way to test whether one was set.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      # Read by android/app/build.gradle. Spelled with the `github` context
      # rather than `env.VERSION_NAME`: the `env` context is not available in
      # `jobs.<job_id>.env`, and using it there makes the whole workflow file
      # invalid — GitHub then refuses to run any of it.
      PLANNER_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      PLANNER_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # No android-actions/setup-android here on purpose: the ubuntu-latest
      # image already ships the SDK at ANDROID_HOME with the licences accepted
      # (command-line tools 12, platform android-36, build-tools 36.0.0/36.1.0
      # as of writing), which is everything compileSdk/targetSdk 36 needs. That
      # action added a third-party dependency that failed the build while doing
      # nothing the image had not already done.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Work out the domain whose links open the app
        # Android's App Links intent filter and iOS's associated-domains
        # entitlement both name a domain, and it is the deployment's: the same
        # address the shells load or call. The value is exported for the build
        # steps below, which read it as PLANNER_LINK_HOST (see docs/APPS.md §3).
        env:
          LINK_ORIGIN: ${{ inputs.link_origin || vars.PLANNER_LINK_ORIGIN || env.APP_URL || env.API_ORIGIN }}
        run: |
          host="$(printf '%s' "$LINK_ORIGIN" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#/.*$##')"
          echo "PLANNER_LINK_HOST=${host}" >> "$GITHUB_ENV"
          if [ -n "$host" ]; then
            echo "Links on ${host} will open the app once that domain serves its /.well-known files."
          else
            echo "No deployment address: the app answers planner:// links only."
          fi
      - name: Build the web app into the Android project
        run: npm run native:sync -- android
        env:
          PLANNER_APP_URL: ${{ env.APP_URL }}
          PLANNER_API_ORIGIN: ${{ env.API_ORIGIN }}
      - name: Decode the upload keystore, when the repository has one
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          # `storeFile` is resolved against the app module, so the keystore
          # lives in android/app/keystore/. Both files are git-ignored and the
          # job's workspace is thrown away after the build.
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
      - name: Check the release keystore against the pinned certificate
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          # Check the key that Gradle will actually use, before spending time
          # building. Certificate fingerprints are public; never print passwords
          # or the keystore bytes. A missing file must not trigger debug signing.
          if [[ ! -s android/app/keystore/release.jks || ! -s android/keystore.properties ]]; then
            echo "::error title=Android release keystore missing::The tagged build would fall back to the debug signer. Check ANDROID_KEYSTORE_BASE64 and the signing secrets."
            exit 1
          fi
          actual="$(keytool -exportcert -keystore android/app/keystore/release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          expected="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ' :\t\r\n' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::warning title=Android signing pin disagrees with keystore::Keystore certificate $actual differs from ANDROID_SIGNING_CERT_SHA256 ($expected). The update feed will record the keystore, which is what Gradle will sign with."
          else
            echo "✓ Release keystore matches the pinned signing certificate."
          fi
      - name: Build APK and AAB
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          # Signed with the upload key when the secrets above exist; otherwise
          # the debug key signs it, which is enough to install and try the app.
          if ./gradlew --no-daemon assembleDirectRelease bundlePlayRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/scripts/ci-annotate.sh" "$RUNNER_TEMP/gradle.log" \
            "Gradle failed" 60
          exit 1
      - name: Verify Android upgrade identity and preserve signing continuity
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/direct/release/app-direct-release.apk"
          apksigner="$(find "${ANDROID_HOME:?}"/build-tools -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "${ANDROID_HOME:?}"/build-tools -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || -z "$aapt" ]]; then
            echo "::error title=Android SDK tools missing::Could not find apksigner and aapt under ANDROID_HOME/build-tools."
            exit 1
          fi

          package_line="$("$aapt" dump badging "$apk" | head -n 1)"
          package_id="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$package_line")"
          version_code="$(sed -nE "s/.*versionCode='([^']+)'.*/\1/p" <<< "$package_line")"
          if [[ "$package_id" != "com.notmtn.planner" ]]; then
            echo "::error title=Android package identity changed::Expected com.notmtn.planner, found ${package_id:-unknown}."
            exit 1
          fi
          if [[ "$version_code" != "$PLANNER_VERSION_CODE" ]]; then
            echo "::error title=Android versionCode mismatch::APK has ${version_code:-unknown}; the release contract expected $PLANNER_VERSION_CODE."
            exit 1
          fi

          certificate_sha256() {
            local printed
            printed="$("$apksigner" verify --print-certs "$1" 2>/dev/null || true)"
            printf '%s\n' "$printed" \
              | grep -iE 'SHA-256 digest:' \
              | head -n 1 \
              | sed -E 's/.*SHA-256 digest:[[:space:]]*//' \
              | tr -d ' :\t\r\n' | tr '[:upper:]' '[:lower:]'
          }
          actual="$(certificate_sha256 "$apk")"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            actual="$(keytool -exportcert -keystore android/app/keystore/release.jks \
              -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          fi
          expected="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ' :\t\r\n' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Android signing certificate unreadable::Could not read the APK or keystore signer SHA-256."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::warning title=Android signing pin disagrees with APK::APK signer SHA-256: $actual; ANDROID_SIGNING_CERT_SHA256: $expected. Publishing this APK's certificate as the in-app update lineage."
          fi

          # Bootstrap by checking every older direct APK. Once one verified
          # update manifest is published, that manifest is the compact lineage
          # record, so later releases compare against it instead of re-downloading
          # the APKs on every run. A rerun also checks its own already-published
          # manifest before clobbering that release's assets.
          release_json="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft,isPrerelease)"
          mapfile -t release_tags < <(printf '%s' "$release_json" | jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
          baseline_manifest_tag=""
          for release_tag in "${release_tags[@]}"; do
            asset_names="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq 'planner-update.json' <<< "$asset_names"; then
              baseline_manifest_tag="$release_tag"
              break
            fi
          done

          checked=0
          if [[ -n "$baseline_manifest_tag" ]]; then
            previous_dir="$(mktemp -d)"
            gh release download "$baseline_manifest_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern planner-update.json --dir "$previous_dir"
            previous="$(jq -r '.platforms.android.signingCertificateSha256 // empty' "$previous_dir/planner-update.json" \
              | tr -d ' :\t\r\n' | tr '[:upper:]' '[:lower:]')"
            rm -rf "$previous_dir"
            if [[ ! "$previous" =~ ^[0-9a-f]{64}$ || "$previous" != "$actual" ]]; then
              echo "::error title=Android signing key changed::The published update contract in $baseline_manifest_tag does not match this APK. Refusing an update that could risk local planner data."
              exit 1
            fi
            checked=1
          else
            # The first permanent-key release bootstraps the signing lineage.
            # Only v1.0.0 and v1.0.1 are known test-only releases made with
            # ephemeral debug keys; later tags remain strict baselines.
            mapfile -t baseline_tags < <(node scripts/android-signing-baseline.mjs "${release_tags[@]}")
            for release_tag in "${baseline_tags[@]}"; do
              asset_names="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              if ! grep -Fxq 'app-release.apk' <<< "$asset_names"; then
                continue
              fi
              previous_dir="$(mktemp -d)"
              gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --pattern app-release.apk --dir "$previous_dir"
              previous="$(certificate_sha256 "$previous_dir/app-release.apk")"
              rm -rf "$previous_dir"
              if [[ ! "$previous" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error title=Could not verify previous APK::The Android signing certificate in $release_tag could not be read."
                exit 1
              fi
              if [[ "$previous" != "$actual" ]]; then
                echo "::error title=Android signing key changed::The APK in $release_tag was signed with a different key. Publishing this build would make Android refuse in-place updates and risk local planner data."
                exit 1
              fi
              checked=$((checked + 1))
            done
          fi
          mkdir -p artifacts/meta
          printf '%s\n' "$actual" > artifacts/meta/android-signing-cert-sha256.txt
          echo "✓ Android package, versionCode, pinned certificate and $checked signing baseline(s) agree."

      - name: Collect the builds
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk artifacts/app-release.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab artifacts/app-play-release.aab
          ls -la artifacts
      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: planner-android
          path: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/meta/android-signing-cert-sha256.txt
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS archive (unsigned)
    needs: [preflight, release-contract]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Work out the domain whose links open the app
        # Android's App Links intent filter and iOS's associated-domains
        # entitlement both name a domain, and it is the deployment's: the same
        # address the shells load or call. The value is exported for the build
        # steps below, which read it as PLANNER_LINK_HOST (see docs/APPS.md §3).
        env:
          LINK_ORIGIN: ${{ inputs.link_origin || vars.PLANNER_LINK_ORIGIN || env.APP_URL || env.API_ORIGIN }}
        run: |
          host="$(printf '%s' "$LINK_ORIGIN" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#/.*$##')"
          echo "PLANNER_LINK_HOST=${host}" >> "$GITHUB_ENV"
          if [ -n "$host" ]; then
            echo "Links on ${host} will open the app once that domain serves its /.well-known files."
          else
            echo "No deployment address: the app answers planner:// links only."
          fi
      - name: Build the web app into the iOS project
        run: npm run native:sync -- ios
        env:
          PLANNER_APP_URL: ${{ env.APP_URL }}
          PLANNER_API_ORIGIN: ${{ env.API_ORIGIN }}
      - name: Archive the app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Planner.xcarchive" \
            PLANNER_LINK_HOST="${PLANNER_LINK_HOST:-planner.invalid}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package the app and its archive
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Planner.xcarchive/Products/Applications/App.app Planner-ios-app.zip
          ditto -c -k --sequesterRsrc --keepParent Planner.xcarchive Planner-ios.xcarchive.zip
          ls -la
      - name: Upload the iOS build
        uses: actions/upload-artifact@v4
        with:
          name: planner-ios
          path: |
            build/Planner-ios-app.zip
            build/Planner-ios.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach the builds to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the machine-readable update manifest
        run: node scripts/create-update-manifest.mjs artifacts "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The release may not exist yet (a tag pushed before the release was
          # written); create it, then attach everything. The internal signing
          # fingerprint is only a build check and is never uploaded.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Planner $tag" --generate-notes
          mapfile -d '' release_assets < <(find artifacts -maxdepth 1 -type f -print0)
          manifest_found=false
          for asset in "${release_assets[@]}"; do
            if [[ "$asset" == "artifacts/planner-update.json" ]]; then
              manifest_found=true
              break
            fi
          done
          if [[ "$manifest_found" != true ]]; then
            echo "::error title=Update manifest missing::planner-update.json was not created."
            exit 1
          fi
          gh release upload "$tag" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Check the website's download buttons resolve
        # The site links to /releases/latest/download/<name>. If an artifact is
        # named differently from what src/marketing/downloads.ts expects, every
        # download button on the site 404s and nothing else would notice — the
        # site ships links, not files. This is the only moment the two exist
        # together, so it is the moment to compare them.
        run: node scripts/check-downloads.mjs
