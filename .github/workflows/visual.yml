# Visual regression: the screens in e2e/visual.spec.ts, compared against
# committed baselines.
#
# Baselines are generated *here* rather than on a laptop on purpose: font
# rendering and subpixel layout differ between machines, so a baseline captured
# on one machine fails on another for reasons nobody can fix. The runner image
# is the single reference.
#
# To (re)create baselines, run this workflow on a branch with the
# `update_baselines` input set, download the `visual-baselines` artifact it
# uploads, and commit its contents to e2e/visual.spec.ts-snapshots/. Review the
# images in the pull request the way you would review code.
name: Visual regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'index.html'
      - 'public/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual.yml'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate the baseline images and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A fresh checkout has no baselines — they are generated on this runner and
      # committed back. So the first run writes them instead of failing, and the
      # artifact it uploads is what gets committed. Once one set exists, a
      # mismatch is a real failure.
      - name: Check for committed baselines
        id: baselines
        run: |
          if [ -n "$(find e2e/visual.spec.ts-snapshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No visual baselines yet::This run writes them and uploads the visual-baselines artifact; commit it to e2e/visual.spec.ts-snapshots/ to turn this job into a real gate."
          fi

      # The suite serves the app from a production build (playwright.config.ts),
      # so the screenshots show what ships rather than what the dev server does.
      - name: Generate the visual baselines
        if: inputs.update_baselines || steps.baselines.outputs.missing == 'true'
        run: npm run test:e2e:visual:update

      - name: Run the visual suite
        if: ${{ !inputs.update_baselines && steps.baselines.outputs.missing != 'true' }}
        run: npm run test:e2e:visual

      # On a first run the images are the deliverable; on a regeneration they are
      # what the maintainer commits. Uploaded either way, even if the run failed.
      - name: Upload baselines
        if: always() && (inputs.update_baselines || steps.baselines.outputs.missing == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          if-no-files-found: warn
          retention-days: 30

      # On a mismatch: the diff images and the HTML report say which pixel moved.
      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
