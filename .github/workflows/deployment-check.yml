name: Check the deployment

# Temporary helper for the "downloaded app does not sign in" investigation: runs
# the same check the Apps preflight runs, and posts its output as a comment so
# the result can be read without opening a job log. Removed once answered.

on:
  push:
    branches: ['arena/01a0ff13-planner']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Ask the deployment about the app origins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the deployment check
        run: |
          set +e
          node scripts/check-deployment.mjs "https://matin-habit-tracker.vercel.app" > output.txt 2>&1
          echo "exit=$?" >> output.txt
          cat output.txt
      - name: Post the answer on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          {
            echo "### \`npm run check:deployment\` against the live deployment"
            echo
            echo '```'
            cat output.txt
            echo '```'
          } > body.md
          if [ -n "$number" ]; then
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            echo "No open pull request for $GITHUB_REF_NAME"
            cat body.md
          fi
