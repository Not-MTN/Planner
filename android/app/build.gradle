apply plugin: 'com.android.application'

// A release build is signed with the upload key when android/keystore.properties
// is present (see docs/APPS.md and .github/workflows/apps.yml). Without it the
// debug key is used, so a locally built release APK can still be installed and
// tried on a device. Neither file is committed.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version numbers default to the values below and are overridden by the Apps
// workflow on a version tag (`v1.2.0` → versionName 1.2.0), so an upload never
// ships with a stale version. Bump the defaults for a store upload made by hand.
def appVersionName = (System.getenv('PLANNER_VERSION_NAME') ?: '').replaceFirst(/^v/, '')
def appVersionCode = (System.getenv('PLANNER_VERSION_CODE') ?: '1') as Integer

// The domain whose links this app answers (AndroidManifest's App Links filter).
// A bare host, with or without the scheme pasted in. The default is a domain
// nobody owns on purpose: an app built without being told where its links live
// is never chosen for anyone else's, and the deployment's own
// /.well-known/assetlinks.json has to name this package for a real host to work
// (see docs/APPS.md §3).
def plannerLinkHost = ((System.getenv('PLANNER_LINK_HOST') ?: 'planner.invalid')
    .trim()
    .replaceFirst(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//, '')
    .replaceFirst(/\/.*$/, ''))

android {
    namespace = "com.notmtn.planner"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
        }
        play {
            dimension "distribution"
        }
    }
    defaultConfig {
        applicationId "com.notmtn.planner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump these for every store upload (versionCode has to increase).
        versionCode appVersionCode
        versionName appVersionName ?: '1.0'
        // Read by the App Links intent filter in AndroidManifest.xml.
        manifestPlaceholders = [plannerLinkHost: plannerLinkHost]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Fall back to the debug key so local release variants remain
            // installable; a real keystore takes over automatically.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Face and fingerprint prompts behind the Keystore-backed key that
    // PlannerBiometricPlugin stores the vault key with (docs/APPS.md §9).
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
